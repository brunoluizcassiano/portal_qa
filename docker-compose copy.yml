version: '3.8'

services:
  massai-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: massai-api
    ports:
      - "8000:8000"
    volumes:
      - ./.streamlit:/app/.streamlit:ro
      - ./config:/app/config:rw
    environment:
      - APP_ROLE=api
      - API_HOST=0.0.0.0
      - API_PORT=8000

      # suas ENVs originais
      - JIRA_BASE_URL=${JIRA_BASE_URL?missing}
      - JIRA_EMAIL=${JIRA_EMAIL?missing}
      - JIRA_API_TOKEN=${JIRA_API_TOKEN?missing}
      - ZEPHYR_BASE_URL=${ZEPHYR_BASE_URL?missing}
      - ZEPHYR_API_TOKEN=${ZEPHYR_API_TOKEN?missing}
      - SECRETS_PATH=/app/.streamlit/secrets.toml
      - TZ=America/Sao_Paulo
      - SCHEDULE_FILE=config/massai_agendamentos.yaml
      - SCHEDULE_KPI_FILE=config/kpis_agendamentos.yaml
      - SETTINGS_FILE=config/settings.yaml
      - HIST_FILE=config/massai_historico_execucoes.yaml
      - HIST_KPI_FILE=config/kpis_historico_execucoes.yaml
      - POLL_INTERVAL=60
      - TOL_MIN=1
    restart: always

  massai-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: massai-dashboard
    depends_on:
      - massai-api
    ports:
      - "8501:8501"
    volumes:
      - ./config:/app/config:rw
    environment:
      - APP_ROLE=dashboard
      - DASHBOARD_HOST=0.0.0.0
      - DASHBOARD_PORT=8501
      - TZ=America/Sao_Paulo
      - API_URL=http://massai-api:8000
      - HIST_KPI_FILE=config/kpis_historico_execucoes.yaml
    restart: always
