[app]
# Você pode usar UMA string…
default_project = "KAN"
# …e/ou uma lista de projetos para varredura
projects = ["KAN"]
# Fuso horário para logs/arquivos (opcional)
timezone = "America/Sao_Paulo"
# ---- Concorrência e paginação (opcionais) ----
zephyr_max_workers = 12       # threads para páginas/TCszephyr_page_size   = 300      # tamanho da página (max 100 na API)zephyr_pause_every = 200      # pausa leve a cada N páginas/futuroszephyr_pause_secs  = 0.2      # segundos de pausa
# ===========================
# FILTROS – TEST EXECUTIONS
# ===========================
# Datas aceitam ISO UTC ("2025-01-01T00:00:00Z") ou "YYYY-MM-DD" (assumimos 00:00Z)
# Se não quiser limitar por data, remova as linhas.
# Pega execuções com término REAL após esta data
zephyr_exec_after  = "2025-01-01T00:00:00Z"    # -> actualEndDateAfter
# (opcional) limite superior
# zephyr_exec_before = "2025-12-31T23:59:59Z"    # -> actualEndDateBefore
# Filtrar por um test case específico (opcional)
# zephyr_exec_test_case = "TRBC-T6508"           # -> testCase
# Incluir links de passos (pode deixar false para ficar mais leve)
# zephyr_exec_include_step_links = true          # -> includeStepLinks
# Só trazer a última execução por test case? (normalmente deixe false)
# zephyr_exec_only_last = false                  # -> onlyLastExecutions
# Restringir por versão do Jira (opcional)
# zephyr_exec_version_id = 12345                 # -> jiraProjectVersionId
# ===================
# FILTROS – TEST CASES
# ===================
# Filtrar criação dos Test Cases por data (opcionais)
zephyr_tc_created_after  = "2025-01-01"
# zephyr_tc_created_before = "2025-12-31"
# Você também pode limitar por projeto(s) usando [app].projects acima.
