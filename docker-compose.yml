version: '3.8'

services:
  massai-api:
    build:
      context: .
      dockerfile: apps/app/Dockerfile.fastapi
    container_name: massai-api
    ports:
      - "8000:8000"
    volumes:
      - ./config:/app/config
      - ./.streamlit:/app/.streamlit:ro    # monta secrets.toml na API
    environment:
      - JIRA_BASE_URL=${JIRA_BASE_URL?missing}
      - JIRA_EMAIL=${JIRA_EMAIL?missing}
      - JIRA_API_TOKEN=${JIRA_API_TOKEN?missing}
      - ZEPHYR_BASE_URL=${ZEPHYR_BASE_URL?missing}
      - ZEPHYR_API_TOKEN=${ZEPHYR_API_TOKEN?missing}
      - SECRETS_PATH=/app/.streamlit/secrets.toml
    restart: always

  massai-dashboard:
    build:
      context: .
      dockerfile: apps/Dockerfile.streamlit
    container_name: massai-dashboard
    ports:
      - "8501:8501"
    depends_on:
      - massai-api
    restart: always

  massai-extractor:
    build:
      context: .
      dockerfile: src/extractor/runner/Dockerfile.run
    container_name: massai-extractor
    volumes:
      - ./.streamlit:/app/.streamlit:ro
      - ./config:/app/config:rw
    environment:
      - JIRA_BASE_URL=${JIRA_BASE_URL?missing}
      - JIRA_EMAIL=${JIRA_EMAIL?missing}
      - JIRA_API_TOKEN=${JIRA_API_TOKEN?missing}
      - ZEPHYR_BASE_URL=${ZEPHYR_BASE_URL?missing}
      - ZEPHYR_API_TOKEN=${ZEPHYR_API_TOKEN?missing}
      - SECRETS_PATH=/app/.streamlit/secrets.toml
      - TZ=America/Sao_Paulo
      - SCHEDULE_FILE=config/massai_agendamentos.yaml
      - SETTINGS_FILE=config/settings.yaml
      - HIST_FILE=config/massai_historico_execucoes.yaml
      - POLL_INTERVAL=60
      - TOL_MIN=1
    depends_on:
      - massai-api
    restart: always
